[project]
name = "jelgram-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.6.3",
    "fastapi[standard]>=0.158.1",
    "httpx2>=2.16.0",
    "pillow>=13.0.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "pywebpush>=2.5.0",
    "redis>=6.4.0",
    "sentry-sdk[fastapi]>=2.73.0",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "locust>=2.46.7",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--strict-markers"]
filterwarnings = ["error::DeprecationWarning:app.*"]  # 自分のコードの非推奨 API はエラーにする

[tool.coverage.run]
source = ["app"]
branch = true  # C1(分岐)カバレッジも測る(14-4)
omit = ["app/worker/celery_app.py", "app/worker/tasks.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise AssertionError", "\\.\\.\\."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/F:基本・I:import の順番・UP:新しい書き方・B:バグの元・S:セキュリティ・SIM:簡潔に・RUF:Ruff 独自
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # 日本語の全角記号(「」・:など)を許す
    "S608",  # SQL の f-string:列名・条件は定数だけを埋め込み、値は必ずバインド変数で渡している
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]  # テストでは assert・固定のダミー値を使う
"scripts/**" = ["S311"]  # 見本データの乱数(暗号には使わない)

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
exclude = ["^tests/"]

[[tool.mypy.overrides]]
module = ["celery.*", "pywebpush.*", "fakeredis.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.worker.tasks"]
disallow_untyped_decorators = false  # Celery の @task に型情報がないため
